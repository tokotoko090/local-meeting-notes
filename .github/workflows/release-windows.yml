name: Build Windows release candidate

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        shell: powershell
        run: |
          choco install ffmpeg nsis -y --no-progress

      - name: Install dependencies and build
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: powershell
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release manifest
        shell: powershell
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          python scripts/release_manifest.py create `
            --artifact "release/LocalMeetingNotesSetup-$version.exe" `
            --platform windows-x64 `
            --source-commit $env:SOURCE_COMMIT `
            --output "release/windows-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate (never publishes a Release)
        uses: actions/upload-artifact@v4
        with:
          name: LocalMeetingNotes-windows-${{ env.SOURCE_COMMIT }}
          if-no-files-found: error
          path: |
            release/LocalMeetingNotesSetup-*.exe
            release/windows-manifest.json
